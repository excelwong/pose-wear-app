apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// 版本号的唯一来源：项目根目录 version.properties（每次打包前用 bump_version.py 递增）
def versionProps = new Properties()
rootProject.file('version.properties').withInputStream { versionProps.load(it) }

android {
    namespace 'com.example.posewear'
    compileSdk 35
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId 'com.example.posewear'
        minSdk 24
        targetSdk 35
        versionCode versionProps['versionCode'].toInteger()
        versionName versionProps['versionName']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding false
        buildConfig false
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
